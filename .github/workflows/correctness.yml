name: Correctness
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: luce-pkg
      - uses: actions/checkout@v4
        with:
          repository: dymokomi/luce-base
          path: luce-base
      # every dependency at main, beside this checkout (luce-base docs/CI.md)
      - name: Check out dependencies at main
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python3 luce-base/tools/checkout_main.py luce-pkg luce
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Bootstrap without language source changes
        working-directory: luce-pkg
        run: python3 tools/bootstrap.py
      - name: All six compiler modes
        working-directory: luce-pkg
        shell: bash
        run: |
          set -o pipefail
          python3 tests/run.py 2>&1 | tee build/correctness.log
      - name: Memory safety instrumentation
        working-directory: luce-pkg
        shell: bash
        run: |
          set -o pipefail
          python3 tests/sanitize.py 2>&1 | tee build/sanitize.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pkg-tests-${{ matrix.os }}
          path: |
            luce-pkg/build/correctness.log
            luce-pkg/build/sanitize.log
